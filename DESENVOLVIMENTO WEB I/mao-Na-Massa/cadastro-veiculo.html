<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Cadastro de Veículo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        }   
    </style>
  </head>

  <body>
    <h1 style="color: brown; font-family: Arial, sans-serif;">Cadastro de Veículo</h1>

    <form method="post">
      <label>Marca do veículo:</label><br />
      <input type="text" /><br /><br />

      <label>Modelo:</label><br />
      <input type="text" /><br /><br />

      <label>Tamanho:</label><br />
      <p></p>
      <input type="radio" name="tamanho" value="pequeno" />  Pequeno<br />
      <input type="radio" name="tamanho" value="medio" />    Médio<br />
      <input type="radio" name="tamanho" value="grande" />  Grande<br /><br />

      <label>Placa:</label><br />
      <input type="text" /><br /><br />

      <button>Cadastrar dados</button>
      <!-- Utilizei duas formas para fazer o botão; "Cadastrar dados" ! -->
    </form>
  </body>
</html>
